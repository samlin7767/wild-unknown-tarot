<!doctype html>
<html lang="zh-Hant">
<head>  
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<meta name="robots" content="noindex">
<title>The Wild Unknown｜Tarot Reference</title>
<style>
:root{--bg:#f7f4ee;--paper:#fffdf9;--ink:#282620;--muted:#79756c;--line:#e4ded2;--accent:#6d7158;--accent-soft:#eceee5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{max-width:1180px;margin:auto;padding:32px 26px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}
.brand small{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:400;letter-spacing:.04em;margin:5px 0 0}.subtitle{font-size:.85rem;color:var(--muted);text-align:right}
.layout{max-width:1180px;margin:auto;padding:26px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:38px}
aside{position:sticky;top:20px;align-self:start}.nav-label{font-size:.68rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 10px 10px}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:8px;font:inherit;font-size:.9rem;color:#625e55;cursor:pointer}.nav button:hover{background:#eeeadf}.nav button.active{background:var(--accent-soft);color:#353a2a;font-weight:600}.nav .disabled{opacity:.55}
main{min-width:0}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase}.page-head h2{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(1.6rem,3vw,2.35rem);font-weight:400;margin:3px 0}.page-head p{color:var(--muted);margin:0;font-size:.9rem}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:16px;text-align:left;color:inherit;cursor:pointer;display:flex;gap:14px;align-items:center;transition:border-color .2s,transform .2s;min-width:0}.card:hover{border-color:#a4a58d;transform:translateY(-2px)}
.art{flex:0 0 72px;aspect-ratio:2/3;border:1px solid #bdb9a8;border-radius:4px;background:linear-gradient(145deg,#f1eee5,#e4e0d3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#666c51}.art:before{content:"✳";font-family:Georgia,serif;font-size:2.4rem;opacity:.7}.art:after{content:"IMAGE";position:absolute;bottom:6px;font-size:.48rem;letter-spacing:.16em;color:#777467}.art.has-image:before,.art.has-image:after{display:none}.art img,.large-art img{width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit}.art.has-image{background:transparent;border-color:transparent}.large-art.has-image{background:transparent;border-color:transparent}.large-art.has-image:before,.large-art.has-image:after{display:none}.card-copy{min-width:0}.card-num{font-size:.68rem;color:var(--muted);letter-spacing:.12em}.card h3{font-family:Georgia,"Noto Serif TC",serif;font-size:1rem;font-weight:500;margin:3px 0}.card .zh{font-size:.82rem;color:var(--muted)}.keywords{font-size:.68rem;line-height:1.5;letter-spacing:.04em;color:var(--accent);margin-top:8px}
.intro-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);margin-bottom:18px;color:var(--ink)}.intro-panel h3{font-family:Georgia,"Noto Serif TC",serif;font-size:1.12rem;font-weight:500;margin:0 0 8px;color:var(--accent)}.intro-panel p{margin:0 0 12px;white-space:pre-line}.intro-panel p:last-child{margin-bottom:0}.intro-panel .section-kicker{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.detail{display:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,32px);margin-bottom:18px}.detail.open{display:block}.back{border:0;background:transparent;color:var(--accent);font:inherit;cursor:pointer;padding:0;margin-bottom:18px}.detail-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px}.large-art{aspect-ratio:2/3;max-width:190px;width:100%;border:1px solid #bdb9a8;border-radius:5px;background:linear-gradient(145deg,#f1eee5,#e4e0d3);display:flex;align-items:center;justify-content:center;color:#666c51;position:relative}.large-art:before{content:"✳";font-family:Georgia,serif;font-size:5rem;opacity:.7}.large-art:after{content:"CARD IMAGE PLACEHOLDER";position:absolute;bottom:12px;font-size:.52rem;letter-spacing:.12em;color:#777467}
.detail h2{font-family:Georgia,"Noto Serif TC",serif;font-weight:400;font-size:clamp(1.5rem,3vw,2.2rem);margin:0}.detail .translated{color:var(--muted);margin:2px 0 10px}.detail .keywords{font-size:.76rem;margin:0 0 20px}.text-label{font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:20px 0 5px}.detail p{margin:0;white-space:pre-line}.empty{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
.notice{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:26px}
footer{border-top:1px solid var(--line);text-align:center;padding:22px;color:var(--muted);font-size:.75rem}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:24px}.aside-inner{position:static}.nav{display:flex;overflow:auto;padding-bottom:5px}.nav-label{margin-top:0}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start}.subtitle{max-width:180px}}
@media(max-width:560px){header{padding:22px 18px;display:block}.subtitle{text-align:left;margin-top:8px}.layout{padding:18px}.page-head{display:block}.search{margin-top:14px;width:100%}.cards{grid-template-columns:1fr}.card{padding:12px}.art{flex-basis:64px}.detail-grid{grid-template-columns:1fr;gap:20px}.large-art{width:145px}.detail{padding:18px}}

/* Mobile reading improvements */
.language-switch{display:none;gap:8px;margin:18px 0 8px}
.language-switch button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:8px 15px;font:inherit;font-size:.9rem;cursor:pointer}
.language-switch button.active{background:var(--accent-soft);border-color:#c7cbb8;color:var(--ink);font-weight:600}
.reading-block{min-width:0}
@media(max-width:560px){
  body{font-size:16px;line-height:1.78}
  header{padding:18px 16px 16px}
  .brand small{font-size:.62rem;letter-spacing:.16em}
  h1{font-size:1.35rem;line-height:1.4}
  .subtitle{font-size:.78rem;line-height:1.55}
  .layout{padding:14px 12px;gap:16px}
  /* Mobile: all navigation flows vertically with the page; no horizontal scrolling */
  aside{position:static;z-index:auto;background:transparent;margin:0;padding:0;border-bottom:0}
  .aside-inner{position:static}
  .nav-label{margin:0 0 6px 4px;font-size:.62rem}
  .nav{display:grid;grid-template-columns:1fr;gap:4px;overflow:visible;padding:0}
  .nav button{display:block;width:100%;white-space:normal;text-align:left;padding:10px 12px;font-size:.88rem;border:1px solid var(--line);border-radius:8px;flex:none}
  .nav button.active{border-color:#c7cbb8;background:var(--accent-soft)}
  .page-head{margin-bottom:15px}
  .page-head h2{font-size:1.65rem;line-height:1.35}
  .page-head p{font-size:.88rem;line-height:1.6;margin-top:5px}
  .intro-panel{padding:16px;border-radius:11px;font-size:.94rem;line-height:1.8}
  .intro-panel h3{font-size:1.08rem}
  .intro-panel p{margin-bottom:14px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .card{display:block;padding:10px;border-radius:10px;min-width:0}
  .art{width:100%;height:auto;aspect-ratio:2/3;margin-bottom:9px}
  .card-copy{padding:0 1px}
  .card-num{font-size:.6rem;letter-spacing:.07em}
  .card h3{font-size:.9rem;line-height:1.4;overflow-wrap:anywhere}
  .card .zh{font-size:.78rem}
  .keywords{font-size:.61rem;line-height:1.45;letter-spacing:0;margin-top:5px;overflow-wrap:anywhere}
  .detail{padding:15px 14px;border-radius:12px}
  .back{font-size:.88rem;margin-bottom:14px;min-height:40px}
  .detail-grid{display:grid;grid-template-columns:1fr;gap:14px}
  .large-art{width:min(68vw,240px);max-width:240px;margin:0 auto 2px}
  .detail-grid>div:last-child{min-width:0}
  .detail h2{font-size:1.55rem;line-height:1.35;overflow-wrap:anywhere}
  .detail .translated{font-size:.95rem}
  .detail .keywords{font-size:.72rem;line-height:1.65;margin-bottom:12px}
  .language-switch{display:flex;flex-wrap:wrap}
  .text-label{font-size:.68rem;letter-spacing:.12em;margin-top:17px}
  .detail p{font-size:1rem;line-height:1.9;overflow-wrap:anywhere}
  .notice{font-size:.75rem;line-height:1.7}
  footer{padding:18px 12px;font-size:.7rem}
}

/* V9: remove the small uppercase English eyebrow labels above headings */
.eyebrow, .section-kicker { display: none !important; }


/* V11: prevent detail text from forcing horizontal scrolling on phones */
html, body { max-width:100%; overflow-x:hidden; }
.layout, main, .detail, .detail-grid, .detail-grid>div, .reading-block { min-width:0; max-width:100%; }
.detail p, .intro-panel p, .detail h2, .detail .translated { overflow-wrap:anywhere; word-break:normal; }
.detail-grid img, .art img, .large-art img { max-width:100%; }

</style>
</head>
<body>
<header>
  <div class="brand"><small>Personal Tarot Reference</small><h1>The Wild Unknown · 塔羅牌義圖鑑</h1></div>
  <div class="subtitle">中英文牌義<br>Tarot meanings</div>
</header>
<div class="layout">
  <aside><div class="aside-inner">
    <p class="nav-label">Library / 牌組</p>
    <nav class="nav" aria-label="塔羅牌組">
      <button data-section="major">The Major Arcana</button>
      <button data-section="minor">The Minor Arcana</button>
      <button data-section="wands" class="active">Wands <span>／權杖</span></button>
      <button data-section="cups">Cups <span>／聖杯</span></button>
      <button data-section="swords">Swords <span>／寶劍</span></button>
      <button data-section="pentacles">Pentacles <span>／星幣</span></button>
    </nav>
  </div></aside>
  <main>
    <div class="page-head">
      <div><div class="eyebrow">Minor Arcana · Suit of Fire</div>
      <input class="search" id="search" type="search" placeholder="搜尋牌名或關鍵字…" aria-label="搜尋牌名或關鍵字"><h2 id="sectionTitle">Wands｜權杖</h2><p id="sectionDesc">靈感、創造力、目標與夢想。選擇一張牌，閱讀英文原文與繁體中文翻譯。</p></div>
    </div>
    <section class="intro-panel" id="introContent"></section>
    <section class="detail" id="detail" aria-live="polite"></section>
    <section class="cards" id="cards"></section>
    <div class="notice">。此網站為個人閱讀工具，不構成專業建議。</div>
  </main>
</div>
<footer>The Wild Unknown Tarot Reference · Personal reading project</footer>
<script src="cards.js"></script>
<script>
const grid=document.getElementById('cards'),detail=document.getElementById('detail'),search=document.getElementById('search');
const title=document.getElementById('sectionTitle'),desc=document.getElementById('sectionDesc'),introContent=document.getElementById('introContent');
let current='wands',query='';
const sectionInfo={
major:{title:'The Major Arcana｜大阿爾卡那',desc:'塔羅的王牌：探索象徵性的內在旅程。',content:`<p>Known as the tarot's trump cards, the twenty-two Major Arcana cards signify a complete journey of the psyche. They are the archetypes we carry within ourselves, the characters or themes that hold us back and set us free. These cards usually indicate deeply rooted issues within our lives. The journey of the Major Arcana begins with the Fool (numbered 0) and ends with the World (numbered XXI). Take your time getting to know these twenty-two cards—they are extremely powerful and should not be taken lightly in your readings.</p><p>大阿爾克那也被稱為塔羅的王牌，二十二張牌象徵心靈完整的旅程。它們代表我們內在所承載的原型，以及那些阻礙我們、也能使我們獲得自由的人物或主題。這些牌通常指向生命中根深蒂固的議題。大阿爾克那的旅程從愚者（編號 0）開始，以世界（編號 XXI）結束。請花時間認識這二十二張牌；它們具有深刻的力量，在解讀時不應輕忽。</p>`},
minor:{title:'The Minor Arcana｜小阿爾卡那',desc:'四個牌組為牌義增添細節與情境。',content:`<p>Together the suits of wands, cups, swords, and Pentacles make up what's called the Minor Arcana. There are fourteen cards within each suit. Cards numbered one through ten usually point to a situation or quality you're experiencing. The eleventh through fourteenth cards (known as the court cards) often represent an actual person in your life. Minor Arcana cards help bring depth and complexity to a reading, giving context to the more dominant Major Arcana cards. You'll find more about the characteristics that define each of the four suits in the following pages.</p><p>權杖、聖杯、寶劍與星幣四個牌組合稱為小阿爾克那。每個牌組有十四張牌。編號一至十的牌通常指向你正在經歷的情況或特質；第十一至第十四張（宮廷牌）則經常代表你生活中的某個真實人物。小阿爾克那為解讀增添深度與複雜性，也為更具主導性的大小阿爾克那牌提供情境。以下將進一步介紹四個牌組各自的特徵。</p><h3>The Court Cards｜宮廷牌</h3><p>The cards numbered eleven through fourteen in each of the Minor Arcana suits are called the court cards. In many decks they're named the Page, Knight, Queen, and king. This deck uses a variation tied to a family system: Daughter, Son, Mother, and Father. This offers an immediate connection to the cards, allowing you to link each character to someone you know. Unlike the other tarot cards, the court cards typically represent people, not situations. They can be hard to interpret at first, so be patient. Here is a simple and generalized guide to get started:</p><p>小阿爾克那每個牌組中，編號第十一至第十四張的牌稱為宮廷牌。許多牌組將它們稱為侍者、騎士、皇后與國王；這副牌則採用與家庭系統相關的稱呼：女兒、兒子、母親與父親。這種方式能讓你迅速與牌面建立連結，將每個角色聯想到生活中認識的人。與其他塔羅牌不同，宮廷牌通常代表人物，而非情境。初學時可能不容易解讀，請耐心熟悉。以下是簡單、概括性的入門指引：</p><h3>The Four Families｜四個家族</h3><p><strong>The Wands Family｜權杖家族</strong><br>A vibrant and well-loved family. They make dangerous enemies. Usually lighter skin and hair.<br>充滿活力、深受喜愛的家族；若成為敵人，可能相當難以應對。通常有較淺的膚色與髮色。</p><p><strong>The Cups Family｜聖杯家族</strong><br>Artistic, open-minded, quiet. A family of dreamers. Lighter skin and hair.<br>富有藝術氣息、思想開放且安靜，是充滿夢想的一家人。通常有較淺的膚色與髮色。</p><p><strong>The Swords Family｜寶劍家族</strong><br>Well educated and highly receptive. Not necessarily a "warm" family. Usually dark skin and hair.<br>受過良好教育、感受力敏銳；不一定是熱情外放的家族。通常有較深的膚色與髮色。</p><p><strong>The Pentacles Family｜星幣家族</strong><br>Very grounded, deeply connected to nature and the home. May have darker hair and eyes.<br>務實而踏實，與自然及家庭有深刻連結。可能有較深的髮色與眼睛顏色。</p>`},
wands:{title:'Wands｜權杖',desc:'靈感、創造力、目標與夢想。',content:`<p>Ruled by the element of fire, the Wands represent inspiration and creativity. They relate to our ambitions, goals, and dreams. They mark the beginning of all ventures within the mind and spirit. Many Wands in a reading indicates the situation resides mostly in the mind...not yet in the external world.</p><p>權杖牌組由火元素主宰，象徵靈感與創造力，並與我們的抱負、目標及夢想有關。它們代表思想與精神層面各種計畫的開端。若一次解讀中出現許多權杖牌，表示事情目前大多仍停留在思想層面，尚未進入現實世界。</p>`},
cups:{title:'Cups｜聖杯',desc:'情感、關係與人際連結。',content:`<p>Cups are the suit of emotion. They address the quality of our relationships and our connections to others. They speak of love, friendship, and all that's in between. The suit of Cups is ruled by the element of water. Several Cups cards indicate the situation mostly involves the heart.</p><p>聖杯是情感的牌組，關注人際關係的品質，以及我們與他人之間的連結。它們談論愛情、友誼，以及兩者之間的各種情感。聖杯牌組由水元素主宰。若一次解讀中出現多張聖杯牌，表示事情主要與內心感受有關。</p>`},
swords:{title:'Swords｜寶劍',desc:'行動、思考、變化與衝突。',content:`<p>The Swords are the suit of action and intellect, ruled by the element of air. These dynamic cards address change, conflict, and power. They point to constructive and destructive tendencies within us all. A reading dominated by Swords indicates a situation of turmoil and distress.</p><p>寶劍是行動與理智的牌組，由風元素主宰。這些充滿動態的牌涉及變化、衝突與力量，也映照出我們每個人身上具有建設性與破壞性的傾向。若一次解讀以寶劍牌為主，通常表示當下處於混亂或不安的情境。</p>`},
pentacles:{title:'Pentacles｜星幣',desc:'物質生活、家庭、金錢與職涯。',content:`<p>The suit of worldly possessions, the Pentacles often speak to issues involving our home, money, or career. They reflect upon our generosity and greed. Pentacles are ruled by the earth element. When many appear in a reading, it means the focus is on material things—property, income, or the home.</p><p>星幣是與世俗財物相關的牌組，經常談及家庭、金錢或職涯等議題，也反映我們的慷慨與貪求。星幣牌組由土元素主宰。若一次解讀中出現許多星幣牌，表示焦點集中在物質層面，例如財產、收入或居住環境。</p>`}
};
document.querySelectorAll('[data-section]').forEach(btn=>btn.addEventListener('click',()=>{current=btn.dataset.section;query='';search.value='';document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b===btn));render()}));
function render(){
 const info=sectionInfo[current];title.textContent=info.title;desc.textContent=info.desc;introContent.innerHTML=info.content;detail.classList.remove('open');detail.innerHTML='';
 const isWands=current==='wands';const filtered=isWands?WANDS_CARDS.filter(c=>(c.name+' '+c.zh+' '+c.keywords+' '+c.keywordsZh+' '+c.en+' '+c.zhText).toLowerCase().includes(query.toLowerCase())):[];
 grid.innerHTML='';if(!isWands){grid.style.display='none';return}grid.style.display='grid';
 if(!filtered.length){grid.innerHTML='<div class="empty">沒有找到符合的牌。請試試其他關鍵字。</div>';return}
 filtered.forEach(c=>{const el=document.createElement('button');el.className='card';el.innerHTML=`<div class="art ${c.image ? 'has-image' : ''}" aria-label="牌面圖片">${c.image ? `<img src="${c.image}" alt="${c.name} tarot card">` : ''}</div><div class="card-copy"><div class="card-num">${c.num} / WANDS</div><h3>${c.name}</h3><div class="zh">${c.zh}</div><div class="keywords">${c.keywords}</div></div>`;el.addEventListener('click',()=>openCard(c));grid.appendChild(el)});
}
function openCard(c){
 detail.innerHTML=`<button class="back" id="back">← 返回權杖牌組</button><div class="detail-grid"><div class="large-art ${c.image ? 'has-image' : ''}" aria-label="牌面圖片">${c.image ? `<img src="${c.image}" alt="${c.name} tarot card">` : ''}</div><div><div class="eyebrow">${c.num} · WANDS</div><h2>${c.name}</h2><div class="translated">${c.zh}</div><div class="keywords">${c.keywords}<br>${c.keywordsZh}</div><div class="language-switch" aria-label="選擇閱讀語言"><button type="button" data-language="en" class="active">English</button><button type="button" data-language="zh">繁體中文</button></div><div class="reading-block" data-reading="en"><div class="text-label">Original English</div><p>${c.en}</p></div><div class="reading-block active" data-reading="zh"><div class="text-label">繁體中文翻譯</div><p>${c.zhText}</p></div></div></div>`;
 detail.classList.add('open');
 document.getElementById('back').addEventListener('click',()=>{detail.classList.remove('open');detail.innerHTML='';});
 const langButtons=detail.querySelectorAll('[data-language]');
 langButtons.forEach(btn=>btn.addEventListener('click',()=>{
   langButtons.forEach(b=>b.classList.toggle('active',b===btn));
   const mode=btn.dataset.language;
   detail.querySelectorAll('[data-reading]').forEach(block=>{
     block.style.display=(block.dataset.reading===mode)?'block':'none';
   });
 }));
 // Default to English; readers can switch to Traditional Chinese.
 detail.querySelectorAll('[data-reading]').forEach(block=>{block.style.display=block.dataset.reading==='en'?'block':'none';});
 langButtons.forEach(b=>b.classList.toggle('active',b.dataset.language==='en'));
 detail.scrollIntoView({behavior:'smooth',block:'start'});
}
search.addEventListener('input',()=>{query=search.value.trim();render()});
render();
</script>
</body>
</html>
